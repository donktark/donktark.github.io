      name: Tutorial
      pageRef: /docs
      weight: 1
    - identifier: Prerequisite
      name: Prerequisite
      pageRef: /prereq
      weight: 3
    - identifier: Community
      name: Community
      pageRef: /community
      weight: 5
    - identifier: Versions
      name: Versions
      weight: 6

    - identifier: latest
      name: Latest ↗
      url: https://donktark.github.io/docs/latest/
      parent: Versions
    - identifier: v0.9
