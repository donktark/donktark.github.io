baseURL: "https://donktark.github.io/"
relativeURLs : true
canonifyURLs : true
# languageCode: en-us
title: My New Hugo Site
theme: PaperMod
pagenate : 5
publishedDir : "/docs" 

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Github.io_Blog
  description: "SSG를 이용한 github.io 기술 블로그입니다."
  keywords: [Blog, Portfolio, PaperMod]
  author: Me
  # author: ["Me", "You"] # multiple authors
  DateFormat: "2006 Jan 2"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false



  profileMode:
    enabled: true
    title: "Github.io Blog __🖋" # optional default will be site title
    subtitle: "SSG (Hugo)를 이용한 블로그 만들기"
    imageUrl: "/images/logo.jpg" # optional
    imageTitle: "Puppy" # optional
    imageWidth: 120 # custom size
    imageHeight: 120 # custom size
    buttons:
      - name: Archive
        url: "/archive/"
      - name: Github
        url: "https://github.com/donktark/donktark.github.io"


  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    # favicon: "</assets>"
    # favicon16x16: "<link / abs url>"
    # favicon32x32: "<link / abs url>"
    # apple_touch_icon: "<link / abs url>"
    # safari_pinned_tab: "<link / abs url>"


menu:
  main:
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 1
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 3
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 5
    - identifier: about
      name: About
      url: /about/
      weight: 7